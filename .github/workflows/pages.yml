# Builds the app and publishes it to GitHub Pages on every push to main.
#
# The site is the browser's part: Coach, Mic and Analyze of a vocal on its own. The vocal isolator
# (/api/separate) is the dev server's and needs Python and Demucs, so on the site Analyze's
# "full track" switch is off; `bun run dev` on your own machine has it.
#
# Pages serves a project under /<repo>/, so the build is given that as its base.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time; a newer push waits for the one in flight instead of cutting it off
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Rust's wasm target
        run: rustup target add wasm32-unknown-unknown
      - run: bun install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build under the site's path
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bun run build --base "$BASE_PATH/"
      - name: The build asks for nothing at the server's root
        # under /<repo>/ a path like "/data/…" is another site's: the dictionary was once loaded
        # that way, which on the site would have left Sing and Speak without their words
        if: steps.pages.outputs.base_path != ''
        run: |
          if grep -rnoE "[\"'\`(]/(assets|data|fonts)/[A-Za-z0-9._-]*" dist --include='*.js' --include='*.css' --include='*.html'; then
            echo "::error::these paths start at the server's root; start them from import.meta.env.BASE_URL"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
